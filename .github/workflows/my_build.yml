name: Build Debug APK

on:
  push:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Make gradlew executable
      run: chmod +x gradlew

    - name: Build APK bypassing checks
      run: ./gradlew assembleDebug -x test -x lint --continue

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: smart-autoclicker-apk
        path: |
          app/build/outputs/apk/debug/*.apk
          smartautoclicker/build/outputs/apk/debug/*.apk
          **/*.apk
